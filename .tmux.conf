set-option -g default-shell /bin/zsh
set -s escape-time 10
set-option -g history-limit 999999

unbind C-b
unbind C-a
bind-key C-Space send-prefix
set -g prefix2 C-Space
set-option -g prefix C-Space


set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Splits keep current pane path.
bind - split-window -v -c "#{pane_current_path}"
bind / split-window -h -c "#{pane_current_path}"

# Pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind -r r rotate-window
bind-key @ choose-window 'join-pane -h -s "%%"'
bind-key s choose-window "join-pane -t '%%'"

bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."

bind b list-buffers
bind p paste-buffer
bind P choose-buffer

# Copy mode and clipboard behavior.
setw -g mode-keys vi
bind Enter copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi W send-keys -X select-word


set -g mouse on

set -g @yank_action 'copy-pipe'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_with_mouse off
# Native tmux copy operations (including double-click selection)
# sync to system clipboard through terminal clipboard/OSC52 support.
set -s set-clipboard on

# Word separators used by tmux selection logic.
set-window-option -g word-separators ' @"=()[]'

# Plugin list.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'soyuka/tmux-current-pane-hostname'
set -g @plugin 'tmux-plugins/tmux-battery'

# Visual defaults.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none
set -g pane-active-border-style bg=default,fg=white
set -g pane-border-style fg=white
set -g pane-border-status top
set -g pane-border-format "#[align=right] #{pane_title} ─"

# Theme/status extras.
run ~/.tmux/plugins/catppuccin-tmux/catppuccin.tmux
set -g pane-active-border-style "fg=#46DCAF,bg=default"
set -g pane-border-style "fg=#A9A9A9"
run ~/.tmux/plugins/tmux-battery/battery.tmux
set -agF status-right "#{E:@catppuccin_status_battery}"

set -g status-position top

# Terminal behavior.
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm*:cstyle"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g display-panes-time 5000
bind -n S-Enter send-keys "^[[13;2u"



# Initialize TPM (keep this at the bottom).
run -b '~/.tmux/plugins/tpm/tpm'
